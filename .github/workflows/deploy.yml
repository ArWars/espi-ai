# ─────────────────────────────────────────────────────────────────────────────
# CI + Deploy espi-ai a Cloud Run (Servicio Unificado espi-ia)
#
# Pipeline:
#   1. test        — bun install + typecheck + bun test (con cache)
#   2. docker      — build + push a Artifact Registry
#   3. deploy      — deploy a Cloud Run service "espi-ia" (unificado, ingress internal)
# ─────────────────────────────────────────────────────────────────────────────
name: CI & Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'bun.lock'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: southamerica-west1-docker.pkg.dev
  REPO: southamerica-west1-docker.pkg.dev/espi-ia-491115/espi-docker
  SERVICE: espi-ia
  REGION: southamerica-west1

jobs:
  test:
    name: Typecheck + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test test/domain.test.ts

  deploy:
    name: Build + Deploy Cloud Run
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER || 'projects/502250036715/locations/global/workloadIdentityPools/github-pool/providers/github-provider' }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT || 'github-actions-deployer@espi-ia-491115.iam.gserviceaccount.com' }}
          token_format: access_token

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REPO }}/espi-ai:${{ github.ref_name }}
            ${{ env.REPO }}/espi-ai:${{ github.sha }}
          platforms: linux/amd64
          provenance: false
          cache-from: type=registry,ref=${{ env.REPO }}/espi-ai:buildcache
          cache-to: type=registry,ref=${{ env.REPO }}/espi-ai:buildcache,mode=max

      # ── Servicio Unificado espi-ia (API HTTP + BullMQ worker en 1 solo service) ──
      - name: Deploy espi-ia to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.REPO }}/espi-ai:${{ github.ref_name }}
          secrets: |
            GEMINI_API_KEY=espi-gemini-api-key:latest
            REDIS_PASSWORD=espi-redis-password:latest
          env_vars: |
            LLM_PROVIDER=gemini
            REDIS_HOST=${{ vars.REDIS_HOST || '10.1.0.4' }}
            ESPI_REDIS_DB=3
            API_TOKEN=${{ secrets.API_TOKEN }}
          flags: >-
            --allow-unauthenticated
            --ingress=internal
            --min-instances=0
            --max-instances=20
            --cpu=1
            --memory=1Gi
            --timeout=120
            --concurrency=80
            --vpc-egress=private-ranges-only
            --network=splec-vpc
            --subnet=splec-subnet
